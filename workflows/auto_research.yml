name: Autonomous xAI Research Generator

on:
  schedule:
    - cron: '0 3 * * *' # Darbosies katru dienu pulksten 3:00 naktī automātiski, kad dators ir izslēgts
  workflow_dispatch: # Ļauj tev to palaist arī manuāli ar vienu klikšķi no GitHub lapas

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main.py script
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          REPO_PATH: "."
        run: |
          python main.py

      - name: Commit and push generated research to repository
        run: |
          git config --global user.name "Parallax Autonomous Agent"
          git config --global user.email "agent@myparallax.org"
          git add myparallax_repo/posts/
          git commit -m "Auto-generated daily research article from xAI Grok" || echo "No changes to commit"
          git push