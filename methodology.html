<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Methodology | Project Parallax</title>
<meta name="description" content="How Project Parallax produces its evidence profiles: sources, classification, checklist coverage, human review, limits and a public corrections log.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #02030a; color: #e0e6ed; }
  h1, h2, h3, .brand-font { font-family: 'Cinzel', serif; }
  .tb:focus-visible, a:focus-visible { outline:2px solid rgba(90,190,255,.7); outline-offset:2px; }
  .prose-p { color:#cbd5e1; font-weight:300; line-height:1.7; font-size:15px; }
  .prose-p + .prose-p { margin-top:.9rem; }
  .card { border:1px solid #1e293b; background:rgba(15,23,42,.45); border-radius:16px; }
  code { background:#0f172a; padding:1px 6px; border-radius:6px; font-size:.85em; color:#fcd34d; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">
<header class="border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="tribunal.html" class="text-amber-400 hover:text-amber-300 font-medium text-sm transition">&larr; <span data-i18n="back"></span></a>
    <div class="flex text-xs font-bold uppercase tracking-wider border border-slate-700 rounded-lg overflow-hidden" role="group" aria-label="Language">
      <button class="tb px-3 py-1.5" id="lang-LV" type="button">LV</button>
      <button class="tb px-3 py-1.5" id="lang-EN" type="button">EN</button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 sm:px-6 py-12 sm:py-16 flex-grow space-y-12">
  <div class="text-center">
    <span class="text-amber-400 text-xs font-bold uppercase tracking-widest" data-i18n="kicker"></span>
    <h1 class="text-3xl sm:text-5xl font-bold text-white brand-font mt-2 mb-4" data-i18n="title"></h1>
    <p class="text-slate-400 text-sm sm:text-base font-light leading-relaxed" data-i18n="lede"></p>
  </div>
  <div id="sections" class="space-y-10"></div>

  <section aria-labelledby="log-h">
    <h2 id="log-h" class="text-2xl font-bold text-white brand-font mb-1" data-i18n="log-h"></h2>
    <p class="text-sm text-slate-400 mb-5" data-i18n="log-sub"></p>
    <ol id="log" class="space-y-3"></ol>
    <p id="log-status" class="text-[11px] text-slate-500 font-mono mt-3"></p>
  </section>
</main>

<footer class="border-t border-slate-900 py-8 text-center text-xs text-slate-500 space-y-2">
  <p>© 2026 PROJECT PARALLAX. Open-source critical inquiry and open-minded synthesis.</p>
  <p class="text-amber-400/70 font-mono text-[11px]">Reinis Pavlovs — "Reālāks par redzamo"</p>
</footer>

<script>
const T = {
  EN: {
    back:'Back to the Evidence Tribunal', kicker:'Method & limits', title:'How the numbers are made',
    lede:'Every figure on this site comes from a documented procedure. This page explains what the procedure is, what it can and cannot show, and records every correction made after publication.',
    'log-h':'Corrections log', 'log-sub':'Changes to published statuses, figures or wording, newest first.',
    'log-fail':'The corrections file could not be loaded. If you opened this page as a file, run a local server (py -m http.server 8000).',
    topic:'Topic', all:'All topics',
    sections:[
      {h:'1. What this site is', p:[
        'Project Parallax compares claims about consciousness, ancient engineering, cataclysms and cosmic structure with the published evidence. For each topic it separates three layers: what has been <b>measured or observed</b>, how it has been <b>interpreted</b>, and what remains a <b>hypothesis or open question</b>.',
        'The site also contains essays and models. These are labelled as such and never feed the evidence figures.']},
      {h:'2. Two different numbers', p:[
        '<b>Criteria coverage</b> (e.g. 33.3%) is the share of six testing criteria a topic currently meets: direct measurement, causal mechanism, statistical significance, independent replication, peer-reviewed publication, raw data availability. Each criterion is <code>satisfied</code> (1), <code>partial</code> (0.5), <code>missing</code> (0) or <code>conflict</code>. An unresolved conflict between a claim and its test caps the total. Each status is set by hand in a public file and carries a written justification.',
        '<b>Literature corpus</b> (NDE topic only, for now) is a count of how published abstracts were classified: supports a verifiable observation, observational signal, neural mechanism, null result, inconclusive.',
        'Neither number is the probability that a claim is true, and neither is an effect size. A low coverage value means the evidence checklist is incomplete, not that a claim is false.']},
      {h:'3. How the literature corpus is built', p:[
        'Abstracts are retrieved from PubMed, Europe PMC and OpenAlex (Semantic Scholar when available). Duplicates are removed by normalised title and DOI. A relevance filter then excludes records that are off-topic. A language model classifies each remaining abstract into one category; results are cached so reruns are consistent.',
        'A draft article is generated from the aggregated counts and a skeptic pass, then reviewed by a human. Only approved drafts are published, and the draft is checked against a content hash so it cannot change after approval.']},
      {h:'4. Human review and AI disclosure', p:[
        'Published articles are AI-assisted summaries that a human has reviewed before publication; each carries the review date. Drafts that have not been reviewed are never published.',
        'Review checks wording (attribution, no claim of proof), figures against their source and the separation of measurement, interpretation and hypothesis. It is not peer review.']},
      {h:'5. Known limits', p:[
        'Classification uses abstracts, not full texts, and a language model can misclassify; a single ambiguous record can move a category share.',
        'Counts are publications, not independent cases. Replies, commentaries and reviews of the same case are counted separately.',
        'Search terms, database coverage and publication bias shape what is retrieved. External services occasionally fail, so a rerun can retrieve a slightly different set.',
        'Only the NDE topic currently has a literature corpus. The other topics show criteria coverage only.',
        'Illustrative models (for example orbital diagrams) show a concept, not a measurement.']},
      {h:'6. How contributed studies are handled', p:[
        'Researchers and readers can propose a study on pages that show an "Add a study" button. A proposal needs a reference (a DOI, checked against Crossref and DataCite; or an arXiv/OSF/Zenodo link, or an ISBN for books, which a reviewer checks by hand), the step it informs, whether it supports or challenges that step, and a short reason.',
        'Proposals are held in a private review queue and are not published automatically. A person checks that the paper exists, that the note matches what the paper says, and that the stance is fair. Accepted studies are shown under the relevant step with attribution and are recorded in the corrections log.',
        '<b>A contribution never changes a percentage or status by itself.</b> Figures change only when a reviewer changes a criterion in the public checklist file and writes down why; that change is logged too. Declined proposals are not published.']},
      {h:'7. Reporting an error', p:[
        'If you find a factual error, a missing source or an overstated claim, please tell us. Corrections are made in public and recorded below.']},
      {h:'8. Cite this project', p:[
        'An archived snapshot of the site, checklists, corrections log and pipeline scripts is deposited on Zenodo (licence CC BY 4.0). Cite all versions: <a class="underline hover:text-amber-300" href="https://doi.org/10.5281/zenodo.23301538" rel="noopener">doi:10.5281/zenodo.23301538</a>. Version 1.0.0 (11 October 2026): <a class="underline hover:text-amber-300" href="https://doi.org/10.5281/zenodo.23301539" rel="noopener">doi:10.5281/zenodo.23301539</a>.',
        'Suggested citation: Pavlovs, R. (2026). <i>Project Parallax: evidence-status snapshot</i> (v1.0.0). Zenodo. https://doi.org/10.5281/zenodo.23301539. The live site may be newer than the archived snapshot; the corrections log shows what changed.']}
    ]
  },
  LV: {
    back:'Atpakaļ uz Pierādījumu tribunālu', kicker:'Metode un ierobežojumi', title:'Kā tiek veidoti skaitļi',
    lede:'Katrs skaitlis šajā vietnē rodas dokumentētā procedūrā. Šī lapa skaidro, kāda ir procedūra, ko tā spēj un nespēj parādīt, un reģistrē katru pēc publicēšanas veiktu labojumu.',
    'log-h':'Labojumu žurnāls', 'log-sub':'Publicēto statusu, skaitļu vai formulējumu izmaiņas, jaunākās pirmās.',
    'log-fail':'Labojumu failu neizdevās ielādēt. Ja lapu atvēri kā failu, palaid lokālu serveri (py -m http.server 8000).',
    topic:'Tēma', all:'Visas tēmas',
    sections:[
      {h:'1. Kas šī vietne ir', p:[
        'Project Parallax salīdzina apgalvojumus par apziņu, seno inženieriju, kataklizmām un kosmisko struktūru ar publicētajiem pierādījumiem. Katrai tēmai tas nodala trīs slāņus: kas ir <b>izmērīts vai novērots</b>, kā tas ir <b>interpretēts</b> un kas paliek <b>hipotēze vai atvērts jautājums</b>.',
        'Vietnē ir arī eseju un modeļu saturs. Tas ir tā marķēts un nekad neietekmē pierādījumu skaitļus.']},
      {h:'2. Divi dažādi skaitļi', p:[
        '<b>Kritēriju segums</b> (piem., 33,3%) ir to sešu pārbaudes kritēriju daļa, ko tēma šobrīd izpilda: tiešs mērījums, cēloņsakarības mehānisms, statistiskā nozīmība, neatkarīga atkārtošana, recenzēta publikācija, neapstrādātu datu pieejamība. Katrs kritērijs ir <code>izpildīts</code> (1), <code>daļēji</code> (0,5), <code>trūkst</code> (0) vai <code>konflikts</code>. Neatrisināts konflikts starp apgalvojumu un tā pārbaudi ierobežo kopsummu. Katru statusu nosaka cilvēks publiskā failā ar rakstisku pamatojumu.',
        '<b>Literatūras korpuss</b> (pagaidām tikai NDE tēmai) ir publicētu abstraktu klasifikācijas skaitījums: atbalsta verificējamu novērojumu, novērojumu signāls, neirālais mehānisms, nulles rezultāts, neskaidrs.',
        'Neviens no šiem skaitļiem nav varbūtība, ka apgalvojums ir patiess, un nav efekta lielums. Zems seguma rādītājs nozīmē, ka pierādījumu saraksts ir nepilnīgs, nevis ka apgalvojums ir nepatiess.']},
      {h:'3. Kā veido literatūras korpusu', p:[
        'Abstrakti tiek iegūti no PubMed, Europe PMC un OpenAlex (un Semantic Scholar, ja pieejams). Dublikāti tiek izslēgti pēc normalizēta virsraksta un DOI. Atbilstības filtrs izslēdz neatbilstošus ierakstus. Valodas modelis klasificē katru atlikušo abstraktu vienā kategorijā; rezultāti tiek kešoti, lai atkārtoti palaidieni būtu konsekventi.',
        'No apkopotajiem skaitļiem un skeptiķa gājiena tiek ģenerēts raksta melnraksts, ko pārskata cilvēks. Publicē tikai apstiprinātus melnrakstus, un tos pārbauda pret satura jaucējkodu, lai pēc apstiprināšanas tie nevarētu mainīties.']},
      {h:'4. Cilvēka pārskatīšana un AI atklātība', p:[
        'Publicētie raksti ir AI sagatavoti kopsavilkumi, ko pirms publicēšanas ir pārskatījis cilvēks; katram ir norādīts pārskatīšanas datums. Nepārskatīti melnraksti netiek publicēti.',
        'Pārskatīšana pārbauda formulējumus (atsauce uz avotu, nekādu apgalvojumu par pierādījumu), skaitļus pret avotu un mērījuma, interpretācijas un hipotēzes nodalījumu. Tā nav salīdzinošā recenzēšana.']},
      {h:'5. Zināmie ierobežojumi', p:[
        'Klasifikācija balstās uz abstraktiem, nevis pilniem tekstiem, un valodas modelis var kļūdīties; viens neskaidrs ieraksts var pārbīdīt kategorijas daļu.',
        'Skaitļi ir publikācijas, nevis neatkarīgi gadījumi. Atbildes, komentāri un pārskati par vienu gadījumu tiek skaitīti atsevišķi.',
        'Meklēšanas termini, datubāzu aptvērums un publicēšanas novirze ietekmē to, kas tiek atrasts. Ārējie pakalpojumi dažkārt nedarbojas, tāpēc atkārtots palaidiens var atrast nedaudz atšķirīgu kopu.',
        'Pašlaik literatūras korpuss ir tikai NDE tēmai. Pārējām tēmām ir tikai kritēriju segums.',
        'Ilustratīvi modeļi (piemēram, orbītu diagrammas) rāda ideju, nevis mērījumu.']},
      {h:'6. Kā tiek apstrādāti iesūtītie pētījumi', p:[
        'Pētnieki un lasītāji var ieteikt pētījumu lapās, kurās ir poga "Pievienot pētījumu". Iesniegumam vajag atsauci (DOI, ko pārbauda Crossref un DataCite; vai arXiv/OSF/Zenodo saiti, vai grāmatas ISBN, ko recenzents pārbauda manuāli), soli, uz kuru tas attiecas, norādi, vai tas šo soli atbalsta vai apstrīd, un īsu pamatojumu.',
        'Iesniegumi nonāk privātā pārskatīšanas rindā un netiek publicēti automātiski. Cilvēks pārbauda, vai raksts pastāv, vai piezīme atbilst rakstam un vai nostāja ir godīga. Apstiprinātie pētījumi tiek rādīti zem attiecīgā soļa ar autora norādi un reģistrēti labojumu žurnālā.',
        '<b>Iesniegums pats par sevi nekad nemaina procentu vai statusu.</b> Skaitļi mainās tikai tad, ja pārskatītājs maina kritēriju publiskajā kontrolsarakstā un pieraksta iemeslu; arī šī izmaiņa tiek reģistrēta. Noraidītie iesniegumi netiek publicēti.']},
      {h:'7. Kā ziņot par kļūdu', p:[
        'Ja atrodi faktu kļūdu, trūkstošu avotu vai pārspīlētu apgalvojumu, lūdzu paziņo. Labojumi tiek veikti publiski un reģistrēti zemāk.']},
      {h:'8. Kā citēt šo projektu', p:[
        'Vietnes, kontrolsarakstu, labojumu žurnāla un skriptu arhivēts momentuzņēmums ir ievietots Zenodo (licence CC BY 4.0). Visu versiju citēšanai: <a class="underline hover:text-amber-300" href="https://doi.org/10.5281/zenodo.23301538" rel="noopener">doi:10.5281/zenodo.23301538</a>. Versija 1.0.0 (2026. gada 11. oktobris): <a class="underline hover:text-amber-300" href="https://doi.org/10.5281/zenodo.23301539" rel="noopener">doi:10.5281/zenodo.23301539</a>.',
        'Ieteicamā atsauce: Pavlovs, R. (2026). <i>Project Parallax: evidence-status snapshot</i> (v1.0.0). Zenodo. https://doi.org/10.5281/zenodo.23301539. Dzīvā vietne var būt jaunāka par arhivēto momentuzņēmumu; labojumu žurnāls rāda, kas mainījies.']}
    ]
  }
};
const TOPIC = {
  EN:{consciousness_independence_nde:'NDE & consciousness',megalithic_engineering_acoustics:'Megalithic engineering & acoustics',cyclical_cataclysms_precession:'Cyclical cataclysms & precession',neural_cosmic_isomorphism:'Neural–cosmic isomorphism'},
  LV:{consciousness_independence_nde:'NDE un apziņa',megalithic_engineering_acoustics:'Megalītiskā inženierija un akustika',cyclical_cataclysms_precession:'Cikliskās kataklizmas un precesija',neural_cosmic_isomorphism:'Neironu–kosmiskais izomorfisms'}
};
let lang = 'EN';
try { const s = localStorage.getItem('pp-lang'); if (s === 'EN' || s === 'LV') lang = s; } catch (e) {}
let LOG = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render() {
  document.documentElement.lang = lang.toLowerCase();
  const L = T[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (L[k] !== undefined) el.textContent = L[k]; });
  ['LV','EN'].forEach(l => {
    const b = document.getElementById('lang-' + l), on = l === lang;
    b.className = 'tb px-3 py-1.5 ' + (on ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-amber-400 hover:bg-slate-800');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  document.getElementById('sections').innerHTML = L.sections.map(s =>
    '<section class="card p-5 sm:p-7"><h2 class="text-xl font-bold text-amber-400 brand-font mb-3">' + esc(s.h) + '</h2>' +
    s.p.map(p => '<p class="prose-p">' + p + '</p>').join('') + '</section>').join('');
  const ol = document.getElementById('log');
  if (LOG) {
    ol.innerHTML = LOG.map(e =>
      '<li class="card p-4"><div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-slate-500 font-mono mb-1"><time datetime="' + esc(e.date) + '">' + esc(e.date) + '</time><span>' +
      esc(e.topic === 'all' ? L.all : (TOPIC[lang][e.topic] || e.topic)) + '</span></div><p class="text-sm text-slate-300 font-light leading-relaxed">' + esc(e[lang.toLowerCase()] || e.en) + '</p></li>').join('');
    document.getElementById('log-status').textContent = '';
  } else if (LOG === false) {
    document.getElementById('log-status').textContent = L['log-fail'];
  }
}
['LV','EN'].forEach(l => document.getElementById('lang-' + l).addEventListener('click', () => { lang = l; try { localStorage.setItem('pp-lang', l); } catch (e) {} render(); }));
render();
fetch('content/articles/corrections.json?v=' + Math.floor(Date.now() / 60000), { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { LOG = (d.entries || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date))); render(); })
  .catch(() => { LOG = false; render(); });
</script>
</body>
</html>
