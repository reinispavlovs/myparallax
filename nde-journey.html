*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.6}

.bar a{font-size:14px;text-decoration:none}

main{max-width:960px;margin:0 auto;padding:24px 20px 64px}
.lead h1{font-size:clamp(26px,5vw,40px);color:#fff}

canvas{display:block;width:100%;height:320px;background:#000}
.cap{padding:10px 18px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);font-style:italic}
.dots{display:flex;gap:6px;justify-content:center;padding:14px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid #334155;background:#0f172a;color:var(--mut);font-size:12px;cursor:pointer}
.dots button.on{background:var(--gold2);color:#02030a;border-color:var(--gold2);font-weight:700}
.dots button.done{border-color:var(--gold2);color:var(--gold)}
.body{padding:6px 22px 24px}
.body h2{font-size:24px;color:var(--gold);margin-bottom:6px}
.step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.pov{font-size:17px;font-weight:300;color:#fff;margin:6px 0 18px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}

.card{background:#070b17;border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;font-family:Inter}
.row{margin-bottom:14px}
.row .l{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.row .l b{color:#fff;white-space:nowrap}
.track{position:relative;height:10px;background:#111a2e;border-radius:5px;margin-top:5px}
.fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#d97706,#fbbf24);border-radius:5px}
.ci{position:absolute;top:-3px;bottom:-3px;border-left:2px solid #fff8;border-right:2px solid #fff8;background:#ffffff1a}
.row .n{font-size:11px;color:var(--mut)}
.card p{font-size:13.5px;color:#cbd5e1;margin:0;font-weight:300}
.no{border-color:#7f1d1d55}
.no h3{color:#fca5a5}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}

.nav button.sec{background:#0f172a;color:var(--gold);border:1px solid #334155}
.nav button:disabled{opacity:.3;cursor:default}
.note{font-size:12px;color:var(--mut);margin-top:30px;line-height:1.7}
.note b{color:#cbd5e1}
.intro ul{padding-left:18px;color:#cbd5e1;font-size:14px;font-weight:300}
.intro li{margin-bottom:6px}
.warn{border:1px solid #92400e;background:#451a0322;border-radius:10px;padding:12px 14px;font-size:13px;color:#fde68a;margin-top:14px}

al correlate; others call the link to human experiences premature, since what the animals experienced cannot be known.", "lv": "Stress un skābekļa trūkums, kā zināms, izmaina uztveri un laika novērtējumu. Domu ātrumu un laika gaitu vērtē pēc tam, no atmiņas; tajā brīdī nekas netika mērīts. Žurkām 30 sekunžu laikā pēc sirds apstāšanās konstatēts pārejošs sinhronu gamma viļņu smadzeņu aktivitātes pieaugums (Borjigin u.c., PNAS 2013), un 2023. gada PNAS pētījumā ar četriem mirstošiem pacientiem gamma pieaugums bija diviem no tiem. Daži pētnieki to min kā iespējamu fizisku korelātu; citi saista to ar cilvēku pieredzi par pāragru, jo nevar zināt, ko dzīvnieki pārdzīvoja."}, "no": {"en": "That thinking was actually faster. No measurement exists.", "lv": "Ka domāšana patiešām bija ātrāka. Mērījumu nav."}, "stats": [{"code": "enhanced_consciousness", "en": "More alert than normal", "lv": "Skaidrāka apziņa nekā parasti", "k": 165, "n": 232, "p": 71.1, "lo": 65, "hi": 77}, {"code": "senses_vivid", "en": "Senses more vivid", "lv": "Skaidrākas maņas", "k": 193, "n": 242, "p": 79.8, "lo": 74, "hi": 84}, {"code": "thoughts_faster", "en": "Thoughts sped up", "lv": "Domas paātrinājās", "k": 140, "n": 242, "p": 57.9, "lo": 52, "hi": 64}, {"code": "time_distorted", "en": "Altered sense of time", "lv": "Izmainīta laika izjūta", "k": 212, "n": 287, "p": 73.9, "lo": 68, "hi": 79}]}, {"id": "leave", "codes": ["body_separation_any", "aware_elsewhere"], "scene": "leave", "t": {"en": "Leaving the body", "lv": "Atstāt ķermeni"}, "pov": {"en": "The point of view rises. The body is seen from above.", "lv": "Skatpunkts paceļas. Ķermenis redzams no augšas."}, "exp": {"en": "Out-of-body sensations were produced repeatedly by electrical stimulation of the right angular gyrus in one patient being evaluated for epilepsy (Blanke et al., Nature 2002); the authors suggest such experiences may reflect a failure to integrate somatosensory and vestibular information. Skeptics also propose that a vivid sce topams retāk, nekā liecina tā populārais tēls."}, "no": {"en": "That the light is anything beyond a visual experience.", "lv": "Ka gaisma ir kas vairāk par redzes pieredzi."}, "stats": [{"code": "tunnel", "en": "Tunnel", "lv": "Tunelis", "k": 92, "n": 289, "p": 31.8, "lo": 27, "hi": 37}, {"code": "light_brilliant", "en": "Brilliant light", "lv": "Spilgta gaisma", "k": 172, "n": 242, "p": 71.1, "lo": 65, "hi": 76}, {"code": "light_unearthly", "en": "Unearthly light", "lv": "Neparasta, ne-zemes gaisma", "k": 185, "n": 291, "p": 63.6, "lo": 58, "hi": 69}]}, {"id": "beings", "codes": ["other_world", "mystical_presence", "beings_any", "deceased_beings", "religious_figure"], "scene": "beings", "t": {"en": "Other places, other beings", "lv": "Citas vietas, citas būtnes"}, "pov": {"en": "Figures and a luminous landscape take shape.", "lv": "Veidojas siluetes un gaiša ainava."}, "exp": {"en": "Content tends to match what a person’s culture and expectations supply, and visions of deceased people are also common in bereavement and under some medications. Among those asked, about a quarter knew about NDEs beforehand.", "lv": "Saturs mēdz atbilst tam, ko sniedz cilvēka kultūra un cerības, un mirušu cilvēku parādības ir bieži arī sēru laikā un dažu zāļu ietekmē. No jautātajiem apmēram ceturtā daļa jau iepriekš zināja par NDE."}, "no": {"en": "That these beings exist. A checkable test would be learning something about a deceased person that the narrator could not have known; no such case is verified here.", "lv": "Ka šīs būtnes pastāv. Pārbaudāms tests būtu uzzināt ko par mirušu cilvēku, ko stāstītājs nevarēja zināt; šeit neviens tāds gadījums nav pārbaudīts."}, "stats": [{"code": "other_world", "en": "Entered another world", "lv": "Nokļuva citā pasaulē", "k": 173, "n": 281, "p": 61.6, "lo": 56, "hi": 67}, {"code": "mystical_presence", "en": "Mystical presence or voice", "lv": "Mistiska būtne vai balss", "k": 159, "n": 242, "p": 65.7, "lo": 60, "hi": 71}, {"code": "beings_any", "e fo_meaning"], "scene": "know", "t": {"en": "Understanding and life review", "lv": "Izpratne un dzīves pārskats"}, "pov": {"en": "Scenes flicker past. Everything seems to make sense.", "lv": "Ainas pazib garām. Šķiet, ka viss ir skaidrs."}, "exp": {"en": "Rapid recall of life events is also reported in non-fatal danger and in some seizures. A feeling of sudden understanding can occur without any content that can be checked; the “knowledge” reported is typically general, not specific facts.", "lv": "Strauja dzīves notikumu atsaukšana atmiņā tiek ziņota arī nenāvējošās briesmās un dažās lēkmēs. Pēkšņas izpratnes sajūta var rasties bez jebkāda pārbaudāma satura; ziņotās “zināšanas” parasti ir vispārīgas, nevis konkrēti fakti."}, "no": {"en": "That any of the information was true.", "lv": "Ka kāda no informācijas bija patiesa."}, "stats": [{"code": "understood_all", "en": "Sudden understanding", "lv": "Pēkšņa visa izpratne", "k": 195, "n": 287, "p": 67.9, "lo": 62, "hi": 73}, {"code": "life_review", "en": "Life review", "lv": "Dzīves pārskats", "k": 128, "n": 287, "p": 44.6, "lo": 39, "hi": 50}, {"code": "info_love", "en": "Information: love", "lv": "Zināšanas: mīlestība", "k": 84, "n": 165, "p": 50.9, "lo": 43, "hi": 58}, {"code": "info_meaning", "en": "Information: meaning of life", "lv": "Zināšanas: dzīves jēga", "k": 64, "n": 164, "p": 39.0, "lo": 32, "hi": 47}]}, {"id": "border", "codes": ["border_return"], "scene": "border", "t": {"en": "A border", "lv": "Robeža"}, "pov": {"en": "A threshold. A sense that going on means not coming back.", "lv": "Slieksnis. Sajūta, ka iet tālāk nozīmē neatgriezties."}, "exp": {"en": "Survivorship. Everyone who tells such an account returned, so a point of return is built into every account. We hear nothing from those who did not.", "lv": "Izdzīvošanas aizspriedums. Ikviens, kas stāsta šādu stāstu, ir atgriezies, tāpēc atgriešanās punkts ir ierakstīts katrā stāstā. No tiem, kas neatgriezās, mēs neko nedzirdam."}, "no": {"en": "Anything about what lies beyond the border.", "lv": "Neko par to, kas ir aiz robežas."}, "stats": [{"code": "border_return", "en": "Border or point of no return", "lv": "Robeža, no kuras nav atpakaļceļa", "k": 180, "n": 285, "p": 63.2, "lo": 57, "hi": 69}]}, {"id": "after", "codes": ["values_changed", "life_changes_large", "relationships_changed", "hard_to_express", "memory_more_accurate", "real_now"], "scene": "after", "t": {"en": "Afterwards", "lv": "Pēc tam"}, "pov": {"en": "The room returns. Something feels different.", "lv": "Telpa atgriežas. Kaut kas šķiet citādi."}, "exp": {"en": "Serious life-threatening events change many people whether or not they report an NDE (post-traumatic growth). “Remembered more accurately” and “definitely real” are feelings reported later, with the delay not recorded; vivid memory is not necessarily accurate memory.", "lv": "Nopietni dzīvībai bīstami notikumi maina daudzus cilvēkus neatkarīgi no tā, vai viņi ziņo par NDE (pēctraumatiskā izaugsme). “Atceras precīzāk” un “noteikti bija reāls” ir vēlāk ziņotas sajūtas, kavējums nav reģistrēts; spilgta atmiņa nav obligāti precīza atmiņa."}, "no": {"en": "That the experience caused the changes.", "lv": "Ka pieredze izraisīja pārmaiņas."}, "stats": [{"code": "values_changed", "en": "Values and beliefs changed", "lv": "Mainījās vērtības un uzskati", "k": 173, "n": 294, "p": 58.8, "lo": 53, "hi": 64}, {"code": "life_changes_large", "en": "Large life changes afterwards", "lv": "Lielas dzīves izmaiņas pēc tam", "k": 92, "n": 152, "p": 60.5, "lo": 53, "hi": 68}, {"code": "relationships_changed", "en": "Relationships changed", "lv": "Mainījās attiecības", "k": 138, "n": 229, "p": 60.3, "lo": 54, "hi": 66}, {"code": "hard_to_express", "en": "Hard to put into words", "lv": "Grūti izteikt vārdos", "k": 147, "n": 292, "p": 50.3, "lo": 45, "hi": 56}, {"code": "memory_more_accurate", "en": "Remembers it more accurately than other events", "lv": "Atceras precīzāk nekā citus notikumus", "k": 129, "n": 165, let AC=null,master=null,soundOn=false,stopCur=null;
function audioInit(){if(AC)return true;const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;AC=new A();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);return true}

 const pad=(fs,o)=>{o=o||{};fs.forEach((f,i)=>{const os=AC.createOscillator();os.type=o.type||'sine';os.frequency.value=f;os.detune.value=i%2?5:-5;const g=AC.createGain();g.gain.value=o.vol||.05;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp||1200;os.connect(g);g.connect(fl);fl.connect(bus);const l=AC.createOscillator();l.frequency.value=(o.lfo||.1)*(1+i*.17);const lg=AC.createGain();lg.gain.value=(o.vol||.05)*.5;l.connect(lg);lg.connect(g.gain);os.start();l.start();nodes.push(os,l)})};
