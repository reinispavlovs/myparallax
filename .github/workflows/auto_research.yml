name: Auto Research Generator

on:
  schedule:
    - cron: '0 9 * * 1' # Katru pirmdienu plkst. 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO_PATH: '.'
        run: |
          python main.py

      - name: Commit and push draft
        run: |
          git config --global user.name "Project Parallax Bot"
          git config --global user.email "bot@myparallax.org"
          git add myparallax_repo/drafts/
          git status
          if git diff --staged --quiet; then
            echo "No new draft files to commit."
          else
            git commit -m "Auto-generated draft via GitHub Actions [skip ci]"
            git push
          fi
